[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Every warning is an error. On a contract that gates revocation of an identity,
# "we knew about that warning" is not an answer anybody wants to give later.
deny = "warnings"
# The revocation tally holds more live values than the legacy code generator can
# keep on the stack. via-ir also produces better optimized code, which on a
# function that loops over votes is worth having.
via_ir = true

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 32

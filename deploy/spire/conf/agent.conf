# SPIRE agent for the local stack.
#
# It runs on the HOST, not in a container, because the workloads it attests are
# host processes: the gateway started by `make run-gateway` and the agent
# process in `make demo`. A workload attestor derives identity from what it can
# observe about a process, and it can only observe processes it shares a view
# of.
#
# `make spire-up` extracts this binary from the pinned image, so the version
# running here is the version the compose file names.

agent {
    data_dir    = ".spire/data"
    log_level   = "INFO"
    server_address = "127.0.0.1"
    server_port    = "18081"
    socket_path    = ".spire/public/api.sock"
    trust_domain   = "uai.test"

    # The server's CA bundle, written by `make spire-up` from
    # `spire-server bundle show`. Bootstrapping over an unauthenticated channel
    # would make the first connection the one an attacker wants.
    trust_bundle_path = ".spire/bootstrap.pem"
}

plugins {
    # Matches the server. Whoever holds the token is the node, which is why this
    # is a development choice and not a production one.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    # The attestor that makes this attestation rather than issuance. It reads
    # the calling process's uid, gid, binary path and binary digest from the
    # kernel -- facts the process cannot assert about itself -- and the server
    # only issues an SVID whose registration entry matches them.
    #
    # This is the Podman-native path ADR-0001 named: `unix:uid:…` and
    # `unix:path:…` where Kubernetes would use `k8s:sa:…` and `k8s:pod-image:…`.
    WorkloadAttestor "unix" {
        plugin_data {
            discover_workload_path = true
        }
    }
}

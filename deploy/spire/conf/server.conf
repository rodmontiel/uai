# SPIRE server for the local stack (docs/protocol/16-deployment.md 23.4).
#
# This is a real SPIRE server with a real CA, not a stand-in. What makes it a
# DEVELOPMENT configuration is stated where each choice is made, so that nobody
# copies this file into an environment it was not written for.

server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"

    # The trust domain names who runs the infrastructure. `uai.test` rather than
    # `uai.world`: an SVID minted here must never verify against a production
    # bundle, and a trust domain is the only thing that separates them.
    trust_domain = "uai.test"

    data_dir  = "/opt/spire/data"
    log_level = "INFO"

    # Short by production standards and long by this stack's. An SVID is the
    # answer to "is this process still the workload it was", and an answer that
    # stays true for a day has stopped being evidence about now.
    ca_ttl                = "24h"
    default_x509_svid_ttl = "1h"
}

plugins {
    # SQLite, because this stack is thrown away. A deployment that kept
    # identities would use the PostgreSQL datastore; pointing this at the UAI
    # database would put SPIRE's registration entries in the same blast radius
    # as the registry they are supposed to attest independently.
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }

    # Join tokens: a node proves it belongs by presenting a single-use secret an
    # operator handed it. It is the attestor with no infrastructure requirement,
    # which is exactly why it is the wrong one for production -- whoever holds
    # the token is the node. Production uses the platform's own node identity
    # (instance identity documents, TPM, k8s PSAT).
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys.json"
        }
    }
}

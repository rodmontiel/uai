# Universal Agent Identity — local development stack.
#
# Reference runtime: rootless Podman (docs/adr/0001-podman-rootless-runtime.md).
# Docker Compose reads this file unchanged; the Makefile uses whichever is
# installed. `compose.yaml` is the vendor-neutral Compose Specification name,
# so neither runtime is privileged by the filename either.
#
# RULE — this file contains only services the code actually uses today.
# A stack that starts daemons nothing talks to misrepresents the system, and
# costs every new contributor idle containers on their first `up`. Services
# arrive in the phase that wires them (docs/protocol/19-roadmap.md):
#
#   Phase 6    opa                     policy decision point
#   Phase 7    besu-1..4, witness-1..2 consortium ledger + transparency log
#   Phase 8    uai-web                 frontend
#   Phase 10   uai-gateway             the demo runs the API in-stack
#   Phase 12   spire-server            workload identity (the agent runs on the
#                                      host: see deploy/spire/conf/agent.conf)
#
# Images are pinned by multi-arch manifest digest. A floating tag is an
# unreviewed dependency update executed on every `up` (threat T-07), and it
# makes "works on my machine" unfalsifiable.

name: uai

services:
  postgres:
    image: docker.io/library/postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uai}
      POSTGRES_DB: ${POSTGRES_DB:-uai}
    # Loopback only: a dev database bound to 0.0.0.0 is a dev database every
    # other machine on the café wifi can reach.
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uai} -d ${POSTGRES_DB:-uai}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # SPIRE issues the runtime identities the registry verifies (docs/protocol/
  # 05-registration-binding.md section 9.1). Before phase 12 a binding recorded
  # an svid_spiffe_id the agent signed about itself; this is what replaces that
  # with something the agent cannot assert.
  #
  # Only the SERVER runs here. The agent is a host process, because the
  # workloads it attests are host processes and an attestor can only observe
  # what it shares a view of -- `make spire-up` starts it from the binary in
  # this same pinned image.
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.2@sha256:0ca091ecef5cbc19f2900a789f68ff5c00a31b056768468c6f2d4c3160a7f03c
    command: ["-config", "/opt/spire/conf/server.conf"]
    volumes:
      - ../spire/conf:/opt/spire/conf:ro
      - spiredata:/opt/spire/data
    # Loopback only, like postgres. A SPIRE server reachable from the network
    # is a certificate authority reachable from the network.
    ports: ["127.0.0.1:${SPIRE_PORT:-18081}:8081"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  spiredata:
